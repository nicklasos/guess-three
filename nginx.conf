# Guess three
#
# Optional brute-force mitigation (add inside your http {} block, not here):
#   limit_req_zone $binary_remote_addr zone=guess_limit:10m rate=5r/m;
# Then use a dedicated location /guess { limit_req zone=guess_limit burst=2 nodelay; proxy_pass ...; }
#
server {
    listen 80;
    listen [::]:80;

    server_name cdto.info;

    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server_tokens off;
    more_clear_headers Server;
    client_max_body_size 30m;

        # Proxy all requests to standalone Go service
    location / {
        proxy_pass http://127.0.0.1:8786;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Handle websockets if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}